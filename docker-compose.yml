name: cryo-interlock

services:
  app:
    build: .
    image: cryo-interlock-app
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
    ports:
      # 宿主机端口可配置：HOST_PORT=9000 docker compose up
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped

  verify:
    image: node:20-alpine
    depends_on:
      app:
        condition: service_healthy
    working_dir: /src
    volumes:
      - .:/src:ro
      # 验收专用：供“重启恢复”检查经 Docker Engine API 实际重启 app 容器
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_URL: http://app:8080
      RESTART_MODE: docker
    command: ["sh", "verify/run.sh"]

volumes:
  app-data:
